[project]
name = "technical-office-runtime"
version = "0.1.0"
description = "FastAPI runtime bridge for the isolated Technical Office Agent Suite."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "ezdxf>=0.18",
    "openpyxl>=3.1",
    "Pillow>=10.0.0",
    "PyMuPDF>=1.24",
    "structlog>=24.0.0",
    "mcp[cli]>=1.2.1,<2.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[project.scripts]
toffice = "technical_office_runtime.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["technical_office_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
